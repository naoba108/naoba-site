media:
  - name: images
    label: Images
    input: public/images
    output: ./images
  - name: video
    label: Videos
    input: public/video
    output: ./video
    categories: [video]
  - name: audio
    label: Audio
    input: public/audio
    output: ./audio
    categories: [audio]
  - name: files
    label: Files (PDF)
    input: public/files
    output: ./files

content:
  - name: home
    label: Home page (videos, doors, titles)
    type: file
    path: src/content/home.json
    format: json
    fields:
      - name: hero
        label: Opening screen
        type: object
        fields:
          - { name: video, label: Background video (mp4, keep under 20 MB), type: file, options: { media: video } }
          - { name: poster, label: Still image (shown before the video loads), type: image }
          - { name: button, label: Button text, type: string }
      - name: doors
        label: The five doors
        type: object
        fields:
          - name: dance
            label: Dance door
            type: object
            fields:
              - { name: image, label: Image, type: image }
              - { name: title, label: Title, type: string }
              - { name: subtitle, label: Subtitle, type: string }
              - { name: button, label: Button text, type: string }
          - name: listen
            label: Listen door
            type: object
            fields:
              - { name: video, label: Video (mp4, optional), type: file, options: { media: video } }
              - { name: poster, label: Image (used if there is no video), type: image }
              - { name: title, label: Title, type: string }
              - { name: subtitle, label: Subtitle, type: string }
              - { name: button, label: Button text, type: string }
          - name: journeys
            label: Journeys door
            type: object
            fields:
              - { name: image, label: Image, type: image }
              - { name: title, label: Title, type: string }
              - { name: subtitle, label: Subtitle, type: string }
          - name: film
            label: Film door
            type: object
            fields:
              - { name: image, label: Image, type: image }
              - { name: title, label: Title, type: string }
              - { name: subtitle, label: Subtitle, type: string }
          - name: shop
            label: Samples & Tools door
            type: object
            fields:
              - { name: image, label: Image, type: image }
              - { name: title, label: Title, type: string }
              - { name: subtitle, label: Subtitle, type: string }
          - name: mentorship
            label: Mentorship door
            type: object
            fields:
              - { name: image, label: Image, type: image }
              - { name: title, label: Title, type: string }
              - { name: subtitle, label: Subtitle, type: string }
      - name: geometry
        label: Sacred geometry images
        type: object
        fields:
          - { name: music, label: Sound as medicine image, type: image }
          - { name: gigs, label: Next gigs background image (shown faint), type: image }
          - { name: press, label: Press kit seal, type: image }
      - { name: strip_text, label: Text under the doors, type: string }
      - name: tribe
        label: Newsletter invitation
        type: object
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
          - { name: button, label: Button, type: string }
      - { name: marquee, label: Moving words band (one per line), type: string, list: true }
      - name: reel
        label: Live video
        type: object
        fields:
          - { name: video, label: Video file (mp4, keep under 20 MB), type: file, options: { media: video } }
          - { name: poster, label: Still image shown before it plays, type: image }
          - { name: autoplay, label: Play by itself when scrolled into view (silent), type: boolean }
          - { name: loop, label: Loop, type: boolean }
          - { name: sound_button, label: Show a Sound button so visitors can turn sound on, type: boolean }
          - { name: sound_label, label: Button text when sound is off, type: string }
          - { name: mute_label, label: Button text when sound is on, type: string }
      - name: titles
        label: Section titles and short texts
        type: object
        fields:
          - { name: music, label: Music title, type: string }
          - { name: bandcamp_button, label: Bandcamp button, type: string }
          - { name: gigs, label: Gigs title, type: string }
          - { name: gigs_empty, label: Text when there are no gigs, type: text }
          - { name: press_kicker, label: Small line above Press kit, type: string }
          - { name: press, label: Press kit title, type: string }
          - { name: photos, label: Photos title, type: string }
          - { name: awards, label: Awards title, type: string }
          - { name: stages, label: Where I have played title, type: string }
          - { name: watch, label: Watch title, type: string }
          - { name: youtube_button, label: YouTube button, type: string }
  - name: site
    label: Home, links and taglines
    type: file
    path: src/content/site.json
    format: json
    fields:
      - { name: tagline_1, label: Tagline line 1, type: string }
      - { name: tagline_2, label: Tagline line 2, type: string }
      - { name: tagline_3, label: Tagline line 3, type: string }
      - { name: intro, label: Short intro, type: text }
      - { name: email, label: Contact email, type: string }
      - { name: kofi, label: Ko-fi link, type: string }
      - { name: substack, label: Substack link, type: string }
      - { name: soundcloud, label: SoundCloud link, type: string }
      - { name: spotify, label: Spotify link, type: string }
      - { name: bandcamp, label: Bandcamp link, type: string }
      - { name: instagram, label: Instagram link, type: string }
      - { name: youtube, label: YouTube channel link, type: string }
  - name: awards
    label: Awards
    type: file
    path: src/content/awards.json
    format: json
    fields:
      - name: highlight
        label: Highlight (big title)
        type: object
        fields:
          - { name: title, label: Small line, type: string }
          - { name: detail, label: Big title, type: string }
          - { name: image, label: Highlight graphic, type: image }
          - { name: caption, label: Caption under the graphic, type: string }
      - name: awards
        label: Music awards
        type: object
        list: true
        fields:
          - { name: prize, label: Prize, type: string }
          - { name: org, label: Awarded by, type: string }
          - { name: for, label: For which work, type: string }
          - { name: image, label: Award graphic (optional), type: image }
      - name: film
        label: Film awards
        type: object
        list: true
        fields:
          - { name: prize, label: Prize, type: string }
          - { name: org, label: Festival, type: string }
          - { name: for, label: Film and role, type: string }
      - { name: labels, label: Labels, type: string, list: true }
  - name: dance
    label: Dance page
    type: file
    path: src/content/dance.json
    format: json
    fields:
      - name: hero
        label: Top of page
        type: object
        fields:
          - { name: image, label: Hero image, type: image }
          - { name: kicker, label: Small line above the title, type: string }
          - { name: title, label: "Title (press Enter for a new line)", type: text }
      - name: titles
        label: Section titles and short texts
        type: object
        fields:
          - { name: offerings, label: What I bring title, type: string }
          - { name: watch, label: Watch title, type: string }
          - { name: events, label: CACAO Bass title, type: string }
          - { name: events_empty, label: Text when there are no gatherings, type: text }
          - { name: stages, label: Stages title, type: string }
          - { name: book, label: Book title, type: string }
          - { name: book_text, label: Book text, type: text }
          - { name: book_button, label: Booking button text, type: string }
          - { name: journeys_line, label: Link line to Journeys (leave empty to hide), type: string }
      - { name: book_image, label: Photo next to Book NAOBA, type: image }
      - name: photos
        label: Photos (add, upload, drag to reorder)
        type: object
        list: true
        fields:
          - { name: image, label: Photo, type: image }
          - { name: caption, label: Caption (optional), type: string }
          - { name: alt, label: Description for screen readers (optional), type: string }
      - { name: intro, label: Intro, type: text }
      - { name: collage_title, label: Title under the photo collage, type: string }
      - { name: collage_text, label: Text under the photo collage, type: text }
      - name: offerings
        label: What I bring
        type: object
        list: true
        fields:
          - { name: image, label: Background photo (optional), type: image }
          - { name: focus, label: "Photo framing: left, center, right or e.g. 30% center", type: string }
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
      - { name: soundcloud_track, label: SoundCloud mix link, type: string }
      - { name: show_youtube_video, label: Show the YouTube video section, type: boolean }
      - name: cacao_video
        label: CACAO Bass video (above the gatherings)
        type: object
        fields:
          - { name: video, label: "Video file (mp4, keep under 20 MB)", type: file, options: { media: video } }
          - { name: poster, label: Still image shown before it plays, type: image }
          - { name: caption, label: Caption, type: string }
      - name: videos
        label: Videos
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: youtube_id, label: "YouTube video ID (the letters after watch?v=)", type: string }
      - name: events
        label: CACAO Bass events
        type: object
        list: true
        fields:
          - { name: date, label: Date, type: string }
          - { name: city, label: City, type: string }
          - { name: venue, label: Venue, type: string }
          - { name: tickets, label: Ticket link, type: string }
      - { name: stages, label: Stages and spaces, type: string, list: true }
  - name: listen
    label: Listen page
    type: file
    path: src/content/listen.json
    format: json
    fields:
      - name: hero
        label: Top of page
        type: object
        fields:
          - { name: video, label: Background video (mp4, keep under 20 MB), type: file, options: { media: video } }
          - { name: poster, label: Still image (shown before the video loads, or instead of it), type: image }
          - { name: kicker, label: Small line above the title, type: string }
          - { name: title, label: "Title (press Enter for a new line)", type: text }
      - name: titles
        label: Section titles and short texts
        type: object
        fields:
          - { name: intro, label: Intro title, type: string }
          - { name: field_kicker, label: Small line above field title, type: string }
          - { name: field, label: Field title, type: string }
          - { name: research, label: Research title, type: string }
          - { name: sounds, label: Play with these sounds title, type: string }
          - { name: sounds_text, label: Play with these sounds text, type: text }
          - { name: video, label: Video section title, type: string }
          - { name: learn, label: Learn the craft title, type: string }
          - { name: albums, label: Albums title, type: string }
          - { name: albums_button, label: Albums button text, type: string }
          - { name: learn_text, label: Learn the craft text, type: text }
          - { name: journeys_line, label: Link line to Journeys (leave empty to hide), type: string }
      - { name: field_background, label: Background photo behind the film section, type: image }
      - name: albums
        label: Heart in Nature albums to stream
        type: object
        list: true
        fields:
          - { name: title, label: Album title, type: string }
          - { name: url, label: Album link, type: string }
          - { name: album_id, label: Bandcamp album id (number), type: string }
      - { name: albums_link, label: Link for the More on Bandcamp button, type: string }
      - { name: learn_short, label: YouTube Short next to Learn the craft (link), type: string }
      - name: figure
        label: Figure next to the intro (Fig. 1)
        type: object
        fields:
          - { name: caption, label: Caption, type: string }
          - { name: image, label: Image, type: image }
      - name: spectrogram
        label: Second figure (Fig. 2)
        type: object
        fields:
          - { name: show, label: Show it, type: boolean }
          - { name: label, label: Caption, type: string }
          - { name: image, label: Image, type: image }
      - { name: sounds_image, label: Photo next to Play with these sounds, type: image }
      - { name: learn_image, label: Photo next to Learn the craft, type: image }
      - name: photos
        label: Photos (add, upload, drag to reorder)
        type: object
        list: true
        fields:
          - { name: image, label: Photo, type: image }
          - { name: caption, label: Caption (optional), type: string }
          - { name: alt, label: Description for screen readers (optional), type: string }
      - { name: intro, label: Intro, type: text }
      - name: research
        label: Research cards
        type: object
        list: true
        fields:
          - { name: icon, label: Icon image, type: image }
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
      - name: videos
        label: Videos
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: youtube_id, label: YouTube video ID, type: string }
  - name: mentorship
    label: Mentorship page
    type: file
    path: src/content/mentorship.json
    format: json
    fields:
      - name: guide
        label: Pathways guide (prices by email)
        type: object
        fields:
          - { name: show_prices, label: Show prices on the three paths, type: boolean }
          - { name: from, label: Starting price line, type: string }
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
          - { name: button, label: Button, type: string }
          - { name: done, label: Message after they send their email, type: text }
          - { name: file, label: Guide PDF, type: file, options: { media: files } }
      - name: cal
        label: Booking calendar (Cal.com)
        type: object
        fields:
          - { name: kicker, label: Small line above the title, type: string }
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
          - { name: link, label: "Your Cal.com name (the part after cal.com/)", type: string }
      - name: hero
        label: Top of page
        type: object
        fields:
          - { name: image, label: Hero image, type: image }
          - { name: kicker, label: Small line above the title, type: string }
          - { name: title, label: "Title (press Enter for a new line)", type: text }
      - name: titles
        label: Section titles and short texts
        type: object
        fields:
          - { name: video, label: Video title, type: string }
          - { name: paths, label: Three paths title, type: string }
          - { name: paths_lede, label: Line under Three paths, type: text }
          - { name: testimonials, label: Testimonials title, type: string }
      - name: photos
        label: Photos (add, upload, drag to reorder)
        type: object
        list: true
        fields:
          - { name: image, label: Photo, type: image }
          - { name: caption, label: Caption (optional), type: string }
          - { name: alt, label: Description for screen readers (optional), type: string }
      - { name: intro, label: Intro, type: text }
      - { name: video_id, label: Intro video YouTube ID, type: string }
      - name: packages
        label: Packages
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: meaning, label: Meaning, type: string }
          - { name: length, label: Length, type: string }
          - { name: sessions, label: Sessions, type: string }
          - { name: usd, label: Price USD, type: string }
          - { name: eur, label: Price EUR, type: string }
          - { name: plan, label: Payment plan, type: string }
          - { name: includes, label: What's included, type: string, list: true }
  - name: film
    label: Film page
    type: file
    path: src/content/film.json
    format: json
    fields:
      - name: hero
        label: Top of page
        type: object
        fields:
          - { name: image, label: Hero image, type: image }
          - { name: kicker, label: Small line above the title, type: string }
          - { name: title, label: "Title (press Enter for a new line)", type: text }
      - name: titles
        label: Section titles and short texts
        type: object
        fields:
          - { name: services, label: What I make title, type: string }
          - { name: projects, label: Film list title, type: string }
          - { name: gallery, label: Gallery title, type: string }
          - { name: quote, label: Quote form title, type: string }
          - { name: quote_text, label: Quote form text, type: text }
      - name: photos
        label: Photos (add, upload, drag to reorder)
        type: object
        list: true
        fields:
          - { name: image, label: Photo, type: image }
          - { name: caption, label: Caption (optional), type: string }
          - { name: alt, label: Description for screen readers (optional), type: string }
      - { name: services_line, label: Services line (under What I make), type: text }
      - { name: intro, label: Intro, type: text }
      - { name: showreel_id, label: Showreel YouTube ID, type: string }
      - name: services
        label: What I make
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
      - name: projects
        label: Projects
        type: object
        list: true
        fields:
          - { name: year, label: Year, type: string }
          - { name: title, label: Film, type: string }
          - { name: role, label: Your role, type: string }
          - { name: note, label: Award or festival, type: string }
  - name: shop
    label: Shop page
    type: file
    path: src/content/shop.json
    format: json
    fields:
      - name: hero
        label: Top of page
        type: object
        fields:
          - { name: image, label: Hero image, type: image }
          - { name: kicker, label: Small line above the title, type: string }
          - { name: title, label: "Title (press Enter for a new line)", type: text }
      - name: spectrogram
        label: Spectrogram drawing
        type: object
        fields:
          - { name: show, label: Show it, type: boolean }
          - { name: label, label: Caption, type: string }
          - { name: image, label: Image, type: image }
      - name: titles
        label: Section titles and short texts
        type: object
        fields:
          - { name: custom, label: Custom sound world title, type: string }
          - { name: custom_text, label: Custom sound world text, type: text }
      - { name: intro, label: Intro, type: text }
      - name: shelves
        label: Shelves
        type: object
        list: true
        fields:
          - { name: name, label: Shelf name, type: string }
          - { name: image_ratio, label: "Image shape (1/1 square, 4/3 landscape)", type: string }
          - name: items
            label: Products
            type: object
            list: true
            fields:
              - { name: image, label: Cover image, type: image }
              - { name: title, label: Title, type: string }
              - { name: format, label: Format, type: string }
              - { name: text, label: Description, type: text }
              - { name: price, label: Price, type: string }
              - { name: url, label: Ko-fi link, type: string }
              - { name: audio, label: Audio preview (upload an MP3), type: file }
              - { name: status, label: Status, type: string }
  - name: music
    label: Music players (Home)
    type: file
    path: src/content/music.json
    format: json
    fields:
      - { name: intro, label: Short line above the players, type: string }
      - name: players
        label: Players (paste any Spotify or SoundCloud link)
        type: object
        list: true
        fields:
          - { name: title, label: Name, type: string }
          - { name: url, label: Spotify or SoundCloud link, type: string }
          - name: size
            label: Size
            type: select
            options:
              values: [large, compact]
      - { name: healing_title, label: Sound healing title (between the players), type: string }
      - { name: healing_text, label: Sound healing text, type: text }
      - name: bandcamp_albums
        label: Bandcamp albums to stream
        type: object
        list: true
        fields:
          - { name: title, label: Album title, type: string }
          - { name: url, label: Album link, type: string }
          - { name: album_id, label: Bandcamp album id (number), type: string }
  - name: press
    label: Press kit (EPK) and photos (Home)
    type: file
    path: src/content/press.json
    fields:
      - { name: bio_short, label: Short bio for organisers, type: text }
      - { name: epk_pdf, label: EPK PDF link (optional), type: string }
      - { name: rider_pdf, label: Tech rider PDF link (optional), type: string }
      - name: photos
        label: Press photos
        type: object
        list: true
        fields:
          - { name: file, label: File name in public/press (no .jpg), type: string }
          - { name: image, label: Or upload a high-res photo, type: image }
          - { name: title, label: Caption, type: string }
          - { name: credit, label: Photo credit, type: string }
      - { name: articles_title, label: In the press title, type: string }
      - name: articles
        label: Press articles
        type: object
        list: true
        fields:
          - { name: outlet, label: Magazine or blog, type: string }
          - { name: date, label: Date, type: string }
          - { name: title, label: Headline, type: text }
          - { name: author, label: Written by, type: string }
          - { name: image, label: Small preview image, type: image }
          - { name: article_image, label: Full article as one image (if the page is gone), type: image }
          - { name: link, label: Link to the article (if still online), type: string }
          - { name: video, label: Link to the video (optional), type: string }
      - { name: performed_note, label: Line under 'Where I have played', type: string }
      - name: performed
        label: Places I have performed
        type: object
        list: true
        fields:
          - { name: place, label: Venue or festival, type: string }
          - { name: city, label: City, type: string }
          - { name: country, label: Country, type: string }
          - { name: year, label: Year, type: string }
  - name: mixing
    label: Music production page (mixing & mastering)
    type: file
    path: src/content/mixing.json
    fields:
      - name: hero
        label: Top of page
        type: object
        fields:
          - { name: kicker, label: Small line, type: string }
          - { name: title, label: Title, type: string }
          - { name: image, label: Background photo, type: image }
      - { name: title, label: Title, type: string }
      - { name: intro, label: Intro, type: text }
      - name: services
        label: Services
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: usd, label: Price USD, type: string }
          - { name: eur, label: Price EUR, type: string }
          - { name: unit, label: Unit (e.g. per track), type: string }
          - { name: details, label: What's included, type: text }
      - { name: packages_note, label: Packages note, type: text }
      - { name: turnaround, label: Turnaround, type: string }
  - name: shorts
    label: YouTube Shorts (Home, Watch)
    type: file
    path: src/content/shorts.json
    format: json
    fields:
      - name: items
        label: Shorts (paste the YouTube link)
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: url, label: YouTube Shorts link, type: string }
  - name: gigs
    label: Gigs widget (Bandsintown)
    type: file
    path: src/content/gigs.json
    fields:
      - { name: bandsintown_artist, label: Bandsintown artist name or id, type: string }
      - { name: bandsintown_app_id, label: Bandsintown app id (from the widget builder), type: string }
  - name: contact
    label: Contact page
    type: file
    path: src/content/contact.json
    format: json
    fields:
      - name: hero
        label: Top of page
        type: object
        fields:
          - { name: image, label: Hero image, type: image }
          - { name: kicker, label: Small line above the title, type: string }
          - { name: title, label: "Title (press Enter for a new line)", type: text }
      - { name: aside, label: Text next to the form, type: text }
      - name: calendly
        label: Calendar booking (Calendly)
        type: object
        fields:
          - { name: kicker, label: Small line above the title, type: string }
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
          - { name: button, label: Button text, type: string }
          - { name: url, label: Calendly link, type: string }
          - { name: image, label: Sacred geometry image (optional), type: image }
  - name: journeys
    label: Journeys page
    type: file
    path: src/content/journeys.json
    format: json
    fields:
      - name: hero
        label: Top of page
        type: object
